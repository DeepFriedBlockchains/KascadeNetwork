name: Regenerate goref fixtures

on:
  push:
    branches: [ci/goref-regeneration-20261106]

concurrency:
  group: goref-regeneration
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev cmake
          df -h
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Generate and independently validate fixtures
        run: |
          ./simpa/regenerate-goref-fixtures.sh
          git diff --exit-code -- testing/integration/testdata/dags_for_json_tests/upstream-kaspa-originals
      - name: Replay all goref fixtures in release mode
        run: cargo test --locked -p kaspa-testing-integration --release goref -- --test-threads=1
      - name: Record archive digests
        run: sha256sum testing/integration/testdata/dags_for_json_tests/goref*/blocks.json.gz > goref-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: goref-fixtures
          path: |
            goref-sha256.txt
            testing/integration/testdata/dags_for_json_tests/goref*/blocks.json.gz
          if-no-files-found: error
          retention-days: 7

  store:
    needs: regenerate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: goref-fixtures
      - name: Store validated fixture blobs on a separate branch
        env:
          OUTPUT_BRANCH: ci/goref-generated-20261106
        run: |
          sha256sum -c goref-sha256.txt
          git add -- testing/integration/testdata/dags_for_json_tests/goref*/blocks.json.gz
          git diff --cached --stat
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Store validated goref fixture output for ${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/${OUTPUT_BRANCH}"
