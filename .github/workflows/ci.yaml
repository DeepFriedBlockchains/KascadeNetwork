name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --tests --workspace --benches --features kaspa-testing-integration/phase6-staging-preview

  test:
    name: Test Suite
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    # runs-on: ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # matrix:
      #   os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      # Clean unnecessary files to save disk space
      - name: clean unnecessary files to save space
        run: |
          if [ "$(docker images -q)" ]; then
            docker rmi $(docker images -q)
          fi
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/sudo apt/sources.list.d
          sudo apt -y autoremove --purge
          sudo apt -y autoclean
          sudo apt clean
          rm --recursive --force "$AGENT_TOOLSDIRECTORY"
          df -h          

          # remove large packages manually (all but llvm)
          sudo apt-get remove -y '^aspnetcore-.*' || echo "::warning::The command [sudo apt-get remove -y '^aspnetcore-.*'] failed to complete successfully. Proceeding..."
          sudo apt-get remove -y '^dotnet-.*' --fix-missing || echo "::warning::The command [sudo apt-get remove -y '^dotnet-.*' --fix-missing] failed to complete successfully. Proceeding..."
          sudo apt-get remove -y 'php.*' --fix-missing || echo "::warning::The command [sudo apt-get remove -y 'php.*' --fix-missing] failed to complete successfully. Proceeding..."
          sudo apt-get remove -y '^mongodb-.*' --fix-missing || echo "::warning::The command [sudo apt-get remove -y '^mongodb-.*' --fix-missing] failed to complete successfully. Proceeding..."
          sudo apt-get remove -y '^mysql-.*' --fix-missing || echo "::warning::The command [sudo apt-get remove -y '^mysql-.*' --fix-missing] failed to complete successfully. Proceeding..."
          sudo apt-get remove -y azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri --fix-missing || echo "::warning::The command [sudo apt-get remove -y azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri --fix-missing] failed to complete successfully. Proceeding..."
          sudo apt-get remove -y google-cloud-sdk --fix-missing || echo "::debug::The command [sudo apt-get remove -y google-cloud-sdk --fix-missing] failed to complete successfully. Proceeding..."
          sudo apt-get remove -y google-cloud-cli --fix-missing || echo "::debug::The command [sudo apt-get remove -y google-cloud-cli --fix-missing] failed to complete successfully. Proceeding..."
          sudo apt-get autoremove -y || echo "::warning::The command [sudo apt-get autoremove -y] failed to complete successfully. Proceeding..."
          sudo apt-get clean || echo "::warning::The command [sudo apt-get clean] failed to complete successfully. Proceeding..."
          df -h          

      # Free up disk space on Ubuntu
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # This might remove tools that are actually needed, if set to "true" but frees about 6 GB
          tool-cache: false

          # large packages, except llvm, are removed manually during the previous step
          # see: https://github.com/jlumbroso/free-disk-space/issues/6
          # TODO: use the discussed whitelist feature when available
          large-packages: false

          swap-storage: true

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Fix CRLF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Set up cache
        uses: Swatinem/rust-cache@v2
      
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Exercise the three-node CLI runbook
        if: github.head_ref == 'docs/phase6-loopback-operator-runbook-20261123' || github.ref_name == 'docs/phase6-loopback-operator-runbook-20261123' || github.head_ref == 'test/phase6-cli-real-pow-recovery-20261123' || github.ref_name == 'test/phase6-cli-real-pow-recovery-20261123'
        timeout-minutes: 45
        shell: bash
        run: |
          export KASCADE_CLI_KASPAD="$PWD/target/debug/kaspad"
          export KASCADE_CLI_LOGS="$RUNNER_TEMP/phase6-cli-runbook"
          mkdir -p "$KASCADE_CLI_LOGS"
          cargo build -p kaspad
          cargo nextest run -p kaspa-testing-integration --test phase6_loopback_cli_runbook --run-ignored all --test-threads=1 --success-output immediate 2>&1 | tee "$KASCADE_CLI_LOGS/driver.log"

      - name: Validate per-node resource observations
        if: github.head_ref == 'test/phase6-cli-real-pow-recovery-20261123' || github.ref_name == 'test/phase6-cli-real-pow-recovery-20261123'
        shell: bash
        run: |
          export KASCADE_CLI_LOGS="$RUNNER_TEMP/phase6-cli-runbook"
          sed -n 's/^[[:blank:]]*phase6_node_metrics,//p' "$KASCADE_CLI_LOGS/driver.log" > "$KASCADE_CLI_LOGS/metrics.jsonl"
          sed -n 's/^[[:blank:]]*phase6_recovery,//p' "$KASCADE_CLI_LOGS/driver.log" > "$KASCADE_CLI_LOGS/recovery.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["KASCADE_CLI_LOGS"])
          recovery = json.loads((output / "recovery.json").read_text())
          assert recovery["follower"] == "c" and recovery["missed_blocks"] == 6
          assert recovery["accepted_blocks"] == 12 and recovery["final_block_count"] >= 12
          assert recovery["final_virtual_daa_score"] >= 0
          for key in ("final_tip", "final_pruning_point"):
              assert len(recovery[key]) == 64
              int(recovery[key], 16)
          assert 0 <= recovery["reopen_to_rpc_ready_ms"] <= recovery["reopen_to_tip_convergence_ms"]
          path = output / "metrics.jsonl"
          rows = [json.loads(line) for line in path.read_text().splitlines()]
          expected = {(node, stage) for node in "abc" for stage in ("genesis", "converged")}
          expected.add(("c", "before_stop"))
          assert len(rows) == len(expected)
          assert {(row["node"], row["stage"]) for row in rows} == expected
          counters = ("rss_bytes", "disk_io_read_bytes", "disk_io_write_bytes", "storage_size_bytes",
                      "p2p_bytes_sent", "p2p_bytes_received")
          assert all(isinstance(row[key], int) and row[key] >= 0 for row in rows for key in counters)
          PY

      - name: Upload three-node CLI runbook evidence
        if: always() && (github.head_ref == 'docs/phase6-loopback-operator-runbook-20261123' || github.ref_name == 'docs/phase6-loopback-operator-runbook-20261123' || github.head_ref == 'test/phase6-cli-real-pow-recovery-20261123' || github.ref_name == 'test/phase6-cli-real-pow-recovery-20261123')
        uses: actions/upload-artifact@v4
        with:
          name: phase6-cli-runbook
          path: ${{ runner.temp }}/phase6-cli-runbook
          if-no-files-found: error

      - name: Exercise live native-PoW peer reconnection
        if: github.head_ref == 'test/phase6-native-pow-live-peer-reconnect-20261123' || github.ref_name == 'test/phase6-native-pow-live-peer-reconnect-20261123'
        timeout-minutes: 45
        shell: bash
        run: |
          export KASCADE_CLI_KASPAD="$PWD/target/debug/kaspad"
          export KASCADE_CLI_LOGS="$RUNNER_TEMP/phase6-live-peer-reconnect"
          mkdir -p "$KASCADE_CLI_LOGS"
          cargo build -p kaspad
          cargo nextest run -p kaspa-testing-integration --test phase6_loopback_cli_runbook --run-ignored all --test-threads=1 --success-output immediate -E 'test(=phase6_loopback_cli_live_peer_reconnect)' 2>&1 | tee "$KASCADE_CLI_LOGS/driver.log"

      - name: Upload native-PoW peer reconnection evidence
        if: always() && (github.head_ref == 'test/phase6-native-pow-live-peer-reconnect-20261123' || github.ref_name == 'test/phase6-native-pow-live-peer-reconnect-20261123')
        uses: actions/upload-artifact@v4
        with:
          name: phase6-native-pow-live-peer-reconnect
          path: ${{ runner.temp }}/phase6-live-peer-reconnect
          if-no-files-found: error

      - name: Run bounded shielded persistent reopen regression
        env:
          RUST_BACKTRACE: '1'
        run: cargo nextest run -p kaspa-consensus --lib --features phase6-staging-preview -E 'test(bounded_shielded_partial_stream_reopens_unready_and_retries_fresh)'

      - name: Run bounded failed-import cleanup regressions
        env:
          RUST_BACKTRACE: '1'
        run: cargo nextest run -p kaspa-consensus --lib --features phase6-staging-preview -E 'test(bounded_cleanup_)'

      - name: Run descendant recovery and export regression
        env:
          RUST_BACKTRACE: '1'
        run: cargo nextest run -p kaspa-consensus --lib --features phase6-staging-preview -E 'test(authority_integration_promotes_and_recovers_a_committed_descendant_chain)'

      - name: Run focused Simnet recovery, archive and partition regressions
        env:
          RUST_BACKTRACE: '1'
        run: >-
          cargo nextest run -p kaspa-testing-integration --lib
          --features phase6-staging-preview --test-threads=1
          -E 'test(authority_integration_preview_recovers_descendants_after_header_sync)
          | test(authority_integration_preview_verifies_shielded_archive_backfill)
          | test(authority_integration_preview_three_node_partition_rejoin)'

      - name: Run isolated Simnet native and AuxPoW relay regressions
        run: cargo nextest run -p kaspa-testing-integration --test phase6_native_pow_relay --features phase6-staging-preview

      - name: Run cargo build with devnet-prealloc feature
        run: cargo build --features devnet-prealloc --workspace --all --tests --benches

      - name: Run Phase 6 authority integration regressions
        run: cargo nextest run --workspace --test-threads=2 --features kaspa-testing-integration/phase6-staging-preview -E 'test(authority_integration_) | test(bounded_shielded_) | test(bounded_cleanup_)'

      - name: Run cargo test regular features
        run: cargo nextest run --workspace --no-fail-fast

      - name: Run cargo doc tests
        run: cargo test --doc --workspace

      - name: Run cargo test on kaspa-hashes without asm
        run: cargo nextest run -p kaspa-hashes --features=no-asm --benches

      - name: Run cargo doc tests with features=no-asm on kaspa-hashes
        run: cargo test --doc -p kaspa-hashes --features=no-asm

      - name: Run cargo doc
        run: cargo doc --no-deps --workspace
      - name: Run kip-10 example
        run: cargo run --example kip-10

